name: Release

# Roda quando uma tag de versao (ex.: v1.1.0) e enviada ao GitHub.
# Tambem pode ser disparado manualmente na aba Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write      # criar a Release e anexar o .exe
  id-token: write      # necessario para a atestacao de procedencia
  attestations: write  # grava a atestacao (prova de que o .exe veio deste codigo)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar icone
        run: python main.py --make-icon icon.ico

      - name: Compilar com PyInstaller
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DCAccounts --icon icon.ico main.py

      - name: Gerar SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\DCAccounts.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DCAccounts.exe" | Out-File -Encoding ascii dist\DCAccounts.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Atestar procedencia do build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DCAccounts.exe

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-Content dist\DCAccounts.exe.sha256).Split(" ")[0]
          $notes = @"
          ## DC Accounts $tag

          **SHA256:** ``$hash``

          Compilado automaticamente pelo GitHub Actions a partir do codigo deste repositorio.
          Para verificar a origem do arquivo: ``gh attestation verify DCAccounts.exe --repo ${{ github.repository }}``

          > Aviso: o executavel nao tem assinatura digital, entao o Windows Defender/SmartScreen
          > pode alertar. O codigo-fonte esta no repositorio e o build e feito de forma publica
          > pelo GitHub Actions.
          "@
          gh release create $tag dist\DCAccounts.exe dist\DCAccounts.exe.sha256 --title "DC Accounts $tag" --notes "$notes" --verify-tag
